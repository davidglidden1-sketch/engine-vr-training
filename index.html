
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aircraft Engine VR Training</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>

<a-scene background="color: #DCEAF4">

  <!-- Floor -->
  <a-plane position="0 0 -4" rotation="-90 0 0"
    width="20" height="20" color="#808B96">
  </a-plane>

  <!-- Workbench -->
  <a-box position="0 0.8 -4"
    width="3" height="0.2" depth="1.5"
    color="#34495E">
  </a-box>

  <!-- Crankcase -->
  <a-box id="crankcase" class="clickable"
    position="-0.8 1.4 -4"
    width="0.8" height="0.8" depth="0.8"
    color="green">
  </a-box>

  <!-- Cylinder -->
  <a-cylinder id="cylinder" class="clickable"
    position="0 1.4 -4"
    radius="0.4" height="0.8"
    color="#D68910">
  </a-cylinder>

  <!-- Magneto -->
  <a-sphere id="magneto" class="clickable"
    position="0.9 1.4 -4"
    radius="0.4" color="#C0392B">
  </a-sphere>

  <!-- Title -->
  <a-text value="AIRCRAFT ENGINE TRAINING"
    position="-1.7 2.8 -4"
    width="3.5" color="#17202A">
  </a-text>

  <!-- Information panel -->
  <a-plane position="0 2.15 -3.7"
    width="3.5" height="0.7"
    color="#FFFFFF"
    material="side: double">
  </a-plane>

  <a-text id="info"
    value="Click an engine component to learn about it."
    position="-1.6 2.15 -3.68"
    width="3.2" color="#17202A"
    wrap-count="40">
  </a-text>

  <!-- Camera and selection cursor -->
  <a-camera position="0 1.6 0">
    <a-cursor
      raycaster="objects: .clickable"
      color="#222222">
    </a-cursor>
  </a-camera>

</a-scene>

<script>
  // Component information
  const components = {
    crankcase: {
      description:
        "CRANKCASE: Supports the crankshaft and provides the main engine structure.",
      color: "green"
    },
    cylinder: {
      description:
        "CYLINDER: Contains the piston and combustion chamber.",
      color: "#D68910"
    },
    magneto: {
      description:
        "MAGNETO: Produces ignition energy independently of the aircraft electrical system.",
      color: "#C0392B"
    }
  };

  // Find the information panel
  const info = document.querySelector("#info");

  // Make each component interactive
  document.querySelectorAll(".clickable").forEach(
    function(part) {

      part.addEventListener("click", function() {

        // Restore original colors
        document.querySelectorAll(".clickable").forEach(
          function(other) {
            other.setAttribute(
              "color",
              components[other.id].color
            );
          }
        );

        // Highlight selected component
        part.setAttribute("color", "yellow");

        // Display information
        info.setAttribute(
          "value",
          components[part.id].description
        );
      });
    }
  );
</script>

</body>
</html>
